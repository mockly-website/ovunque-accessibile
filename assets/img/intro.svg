<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <!-- Ovunque Accessibile: schermata di caricamento del sito. Il sentiero marrone del logo si disegna a puntini
       fino al segnaposto blu con il simbolo dell'accessibilità, che cade sul punto, rimbalza e lascia un'onda. -->
  <defs>
    <mask id="traccia" maskUnits="userSpaceOnUse">
      <path d="M34 214 C74 216 86 180 120 184 S150 190 158 188" fill="none" stroke="#fff" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;0.45;0.88;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </mask>
  </defs>
  <circle cx="160" cy="132" r="96" fill="#e6f4fd"/>
  <!-- sentiero a puntini -->
  <path d="M34 214 C74 216 86 180 120 184 S150 190 158 188" fill="none" stroke="#8b7d6b" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="0 15" mask="url(#traccia)"/>
  <!-- onda dove cade il segnaposto -->
  <ellipse cx="160" cy="188" rx="6" ry="2.4" fill="none" stroke="#2f5b9c" stroke-width="3" opacity="0">
    <animate attributeName="rx" values="6;6;40" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="2.4;2.4;12" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="160" cy="189" rx="16" ry="5" fill="#162841" opacity=".16">
    <animate attributeName="rx" values="6;16;13;16;16" keyTimes="0;0.4;0.48;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- segnaposto con il simbolo dell'accessibilità -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -60;0 -60;0 0;0 -12;0 0;0 0"
                      keyTimes="0;0.2;0.4;0.47;0.54;1" calcMode="spline"
                      keySplines="0 0 1 1;.5 0 1 1;0 0 .4 1;.5 0 1 1;0 0 1 1" dur="2.4s" repeatCount="indefinite"/>
    <path d="M160 72c-26 0-47 20.6-47 46.2C113 152 160 188 160 188s47-36 47-69.8C207 92.6 186 72 160 72z" fill="#2f5b9c"/>
    <circle cx="160" cy="118" r="30" fill="#fff"/>
    <g transform="translate(137.5 95.5) scale(1.875)" fill="#162841">
      <circle cx="12" cy="4" r="2"/>
      <path d="M19 13v-2c-1.54.02-3.09-.75-4.07-1.83l-1.29-1.43c-.17-.19-.38-.34-.61-.45-.01 0-.01-.01-.02-.01H13c-.35-.2-.75-.3-1.19-.26C10.76 7.11 10 8.04 10 9.09V15c0 1.1.9 2 2 2h5v5h2v-5.5c0-1.1-.9-2-2-2h-3v-3.45c1.29 1.07 3.25 1.94 5 1.95zm-6.17 5c-.41 1.16-1.52 2-2.83 2-1.66 0-3-1.34-3-3 0-1.31.84-2.41 2-2.83V12.1c-2.28.46-4 2.48-4 4.9 0 2.76 2.24 5 5 5 2.42 0 4.44-1.72 4.9-4h-2.07z"/>
    </g>
  </g>
</svg>
