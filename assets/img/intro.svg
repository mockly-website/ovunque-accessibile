<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Ovunque Accessibile: schermata di caricamento. Un pezzo di mappa (come l'icona dell'app): il percorso si disegna
       fino al segnaposto con il simbolo dell'accessibilità, che cade sul punto e lascia un'onda. -->
  <defs>
    <clipPath id="tile"><rect x="20" y="20" width="200" height="200" rx="48"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="20" y="20" width="200" height="200" fill="#e6f4fd"/>
    <!-- isolati e verde -->
    <rect x="34" y="34" width="62" height="58" rx="10" fill="#d6ebf8"/>
    <rect x="144" y="34" width="62" height="70" rx="10" fill="#e7d6b9" opacity=".7"/>
    <rect x="34" y="150" width="70" height="56" rx="10" fill="#e7d6b9" opacity=".7"/>
    <rect x="152" y="156" width="54" height="50" rx="10" fill="#d6ebf8"/>
    <!-- strade -->
    <path d="M20 122 H220" stroke="#fff" stroke-width="16"/>
    <path d="M122 20 V220" stroke="#fff" stroke-width="12"/>
    <path d="M20 214 L214 20" stroke="#fff" stroke-width="8" opacity=".9"/>
    <!-- percorso accessibile che si disegna fino al segnaposto -->
    <path d="M36 204 C60 180 70 150 92 140 S118 140 120 150" fill="none" stroke="#2f5b9c" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" values="160;0;0;160" keyTimes="0;0.45;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- onda dove cade il segnaposto -->
  <ellipse cx="120" cy="152" rx="6" ry="2.4" fill="none" stroke="#2f5b9c" stroke-width="3" opacity="0">
    <animate attributeName="rx" values="6;6;34" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="2.4;2.4;12" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="120" cy="153" rx="14" ry="4.5" fill="#162841" opacity=".18">
    <animate attributeName="rx" values="6;14;12;14;14" keyTimes="0;0.4;0.48;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- segnaposto con il simbolo dell'accessibilità -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -46;0 -46;0 0;0 -9;0 0;0 0"
                      keyTimes="0;0.2;0.4;0.47;0.54;1" calcMode="spline"
                      keySplines="0 0 1 1;.5 0 1 1;0 0 .4 1;.5 0 1 1;0 0 1 1" dur="2.4s" repeatCount="indefinite"/>
    <path d="M120 52c-22 0-40 17.6-40 39.3C80 120 120 152 120 152s40-32 40-60.7C160 69.6 142 52 120 52z" fill="#2f5b9c"/>
    <path d="M120 52c-22 0-40 17.6-40 39.3C80 120 120 152 120 152s40-32 40-60.7C160 69.6 142 52 120 52z" fill="none" stroke="#162841" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="120" cy="91" r="26" fill="#fff"/>
    <g transform="translate(101 72) scale(1.6)" fill="#162841">
      <circle cx="12" cy="4" r="2"/>
      <path d="M19 13v-2c-1.54.02-3.09-.75-4.07-1.83l-1.29-1.43c-.17-.19-.38-.34-.61-.45-.01 0-.01-.01-.02-.01H13c-.35-.2-.75-.3-1.19-.26C10.76 7.11 10 8.04 10 9.09V15c0 1.1.9 2 2 2h5v5h2v-5.5c0-1.1-.9-2-2-2h-3v-3.45c1.29 1.07 3.25 1.94 5 1.95zm-6.17 5c-.41 1.16-1.52 2-2.83 2-1.66 0-3-1.34-3-3 0-1.31.84-2.41 2-2.83V12.1c-2.28.46-4 2.48-4 4.9 0 2.76 2.24 5 5 5 2.42 0 4.44-1.72 4.9-4h-2.07z"/>
    </g>
  </g>
</svg>
